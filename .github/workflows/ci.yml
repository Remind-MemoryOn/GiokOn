name: CI

# 품질·보안 게이트 (T8.2 · T10.6 · T13.3):
#   quality        — typecheck / lint / 비의료 카피 린트 / test / build
#   rls-regression — 테넌트 격리·RBAC·동의·감사 불변식(실 PostgreSQL)
#   security-audit — 의존성 취약점 스캔(SCA)
# 접근성(axe)·SAST(CodeQL)·E2E(Playwright)는 해당 트랙 착수 시 잡을 추가한다.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-audit.test.mjs

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 버전은 package.json 의 packageManager(pnpm@10.33.0)만을 출처로 둔다.
      # action 의 `version` 입력과 병기하면 action-setup 이 중복 지정으로 실패한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - name: 비의료 포지셔닝 카피 린트 (M9.6)
        run: pnpm check:copy
      - name: 웹 디자인 스펙 대조 — Figma 실측 고정 (apps/web/AGENTS.md §1)
        run: pnpm check:design
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Install Chromium for authentication isolation regression
        run: pnpm -F @giokon/web exec playwright install chromium
      - name: Account transition isolation (React and Query)
        run: pnpm -F @giokon/web test:auth

  rls-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL service client
        run: docker exec "${{ job.services.postgres.id }}" psql --version
      - name: Supabase 심 적용
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/_supabase_shims.sql
      - name: 마이그레이션 버전 중복 검사
        run: |
          dup=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dup" ]; then echo "마이그레이션 버전 중복: $dup"; exit 1; fi
      - name: 마이그레이션 순차 적용
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── applying $f"
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < "$f"
          done
      - name: 테스트 롤 권한 부여
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/_grants.sql
      - name: RLS·RBAC·격리 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/rls_regression.sql
      - name: 전사 출처 저장 계약 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/transcript_provenance.sql
      - name: 파일럿 권한 재설계 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/pilot_access.sql
      - name: 법률 문서 동의 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/legal_consents.sql
      - name: 일지 초안 워커 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/journal_worker.sql
      - name: 위험 발화 알림·푸시 큐 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/safety_push.sql
      - name: 안전 이벤트 판정·근거 보호 회귀 테스트
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/safety_evidence.sql
      - name: 세션 시작 무결성 회귀 테스트(설계자≠진행자 · 서버 시각 · 어르신당 1세션)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/session_start.sql
      - name: 음성 세션 점유 회귀 테스트(세션당 연결 1개 · 만료 · 본인만)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/voice_lease.sql
      - name: 어르신 요청 마무리 기록 회귀 테스트(본인만 · 세션당 한 번 · 원문 없음)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/elder_closing.sql
      - name: 제품 이벤트 회귀 테스트(검토 중 고친 칸 이름만 · 서버만 기록 · 운영 권한)
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/product_events.sql
      - name: 감사 기록 보존·Storage 기관 격리·공개 자동 철회 회귀
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/audit_retention.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/storage_policies.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/share_auto_revoke.sql
      - name: 확정 일지 상위 삭제·Storage 변조 회귀
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/finalized_journal_integrity.sql
      - name: 워커 동의 철회·운영 스키마 권한 회귀(동의 철회는 마지막)
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/journal_worker_consent.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/prod_privileges.sql

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 버전은 package.json 의 packageManager(pnpm@10.33.0)만을 출처로 둔다.
      # action 의 `version` 입력과 병기하면 action-setup 이 중복 지정으로 실패한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 배포본(apps/web)에 닿는 high/critical 만 막고, 나머지(모바일 개발·빌드 도구)는
      # 목록으로 보고한다. 전부를 막으면 게이트가 상시 빨간불이라 아무도 안 보게 된다.
      # 판정 근거·예외는 scripts/check-audit.mjs 주석에 있다.
      - name: 의존성 취약점 게이트 (SCA)
        run: pnpm check:audit
