name: CI

# 품질·보안 게이트 (T8.2 · T10.6 · T13.3):
#   quality        — typecheck / lint / 비의료 카피 린트 / test / build
#   rls-regression — 테넌트 격리·RBAC·동의·감사 불변식(실 PostgreSQL)
#   security-audit — 의존성 취약점 스캔(SCA)
# 접근성(axe)·SAST(CodeQL)·E2E(Playwright)는 해당 트랙 착수 시 잡을 추가한다.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 버전은 package.json 의 packageManager(pnpm@10.33.0)만을 출처로 둔다.
      # action 의 `version` 입력과 병기하면 action-setup 이 중복 지정으로 실패한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - name: 비의료 포지셔닝 카피 린트 (M9.6)
        run: pnpm check:copy
      - name: 웹 디자인 스펙 대조 — 완성 디자인 고정 (docs/require/기억온_웹_디자인.md)
        run: pnpm check:design
      - run: pnpm -r test
      - run: pnpm -r build

  rls-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Supabase 심 적용
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/_supabase_shims.sql
      - name: 마이그레이션 순차 적용
        run: |
          for f in supabase/migrations/*.sql; do
            echo "── applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: 테스트 롤 권한 부여
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/_grants.sql
      - name: RLS·RBAC·격리 회귀 테스트
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_regression.sql

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 버전은 package.json 의 packageManager(pnpm@10.33.0)만을 출처로 둔다.
      # action 의 `version` 입력과 병기하면 action-setup 이 중복 지정으로 실패한다.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 의존성 취약점 스캔 (SCA)
        run: pnpm audit --audit-level high
        # 초기에는 정보성으로 두고, 트리아지 정착 후 게이트로 승격한다.
        continue-on-error: true
