packages:
  - "apps/*"
  - "packages/*"

# pnpm 10부터 버전 오버라이드는 package.json 의 "pnpm.overrides" 가 아니라 여기에 둔다.
# (구 위치는 무시되며 [WARN] "pnpm.overrides" ignored 경고가 난다.)
overrides:
  # Expo SDK 54 는 Reanimated 4 를 쓴다(New Architecture 전용). NativeWind 4.2.6 /
  # react-native-css-interop 0.2.6 의 peer 가 reanimated >=3.6.2 라 함께 쓸 수 있다.
  react-native-reanimated: 4.1.1
  # Reanimated 4 는 react-native-worklets 를 별도 패키지로 쓴다. 범위가 느슨해
  # pnpm 이 0.12.1(RN 0.83~0.87 전용)을 골라 peer 경고가 났다 → SDK 54 가 지정한
  # 0.5.1 로 고정한다.
  react-native-worklets: 0.5.1
  # expo-router 6 이 요구하는 런타임. 호이스트가 구버전(5.x)을 남겨 경고가 났다.
  "@expo/metro-runtime": 6.1.2
  # @types/react 단일 버전 강제 — 웹(19.2.x)·모바일(19.0.x)이 각각 다른 타입을 쓰면
  # 루트 호이스트 대상이 설치 순서에 따라 흔들려, @expo/vector-icons 의 Icon 이
  # 다른 @types/react 로 타입 결정되어 ui.tsx JSX 에서 TS2786 이 터진다(2026-08-23).
  # 모든 패키지를 하나의 타입 버전으로 묶는다(웹 19.2 에 맞춘다 — RN 0.81 은 19.x 면 된다).
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  # 의존성 보안 패치(2026-10-11) — `pnpm audit` 의 critical/high 를 **같은 메이저 안의 패치 버전**으로만 올린다.
  # 전부 apps/mobile 의 개발·빌드 도구 경로(Expo CLI·Metro·ESLint·Babel·SVG 변환)이고, 앱 번들에 실리는 것은
  # nanoid(expo-router, 고정 길이 호출) 하나뿐이다. 메이저 상향이 필요한 것은 넣지 않는다 —
  # tinypool(vitest 4 필요 · 별도 과제) · image-size(metro, 2.x) · 수정판 없음: node-forge · braces.
  # 상위 패키지가 패치 버전을 끌어오면 해당 줄을 지운다(`pnpm audit` 로 확인).
  "shell-quote@<1.11.0": 1.11.0
  "@xmldom/xmldom@>=0.8.0 <0.8.15": 0.8.15
  "@xmldom/xmldom@>=0.9.0 <0.9.12": 0.9.12
  "brace-expansion@<1.1.20": 1.1.20
  "brace-expansion@>=2.0.0 <2.1.6": 2.1.6
  "brace-expansion@>=5.0.0 <5.0.11": 5.0.11
  "browserslist@<4.28.7": 4.28.7
  "compression@<1.8.2": 1.8.2
  "js-yaml@>=3.0.0 <3.15.2": 3.15.2
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  "postcss@>=8.0.0 <8.5.18": 8.5.18
  "source-map-js@<1.2.2": 1.2.2
  "svgo@>=3.0.0 <3.3.5": 3.3.5
  "tar@>=7.0.0 <7.5.21": 7.5.21
  "undici@>=6.0.0 <6.28.1": 6.28.1
