# 기억온 웹(apps/web) — Netlify 배포 설정 (pnpm 모노레포)
#
# 사이트 "Base directory"는 저장소 루트(빈 값)로 두세요. Netlify는 root
# package.json의 packageManager(pnpm)와 pnpm-lock.yaml을 감지해 corepack으로
# pnpm을 사용합니다. workspace:* 의존성 때문에 npm은 사용하면 안 됩니다.
[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @giokon/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — React Router가 모든 경로 처리
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
